services:

  db:
    image: postgres:16-alpine
    container_name: schoolnorm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolnorm
      POSTGRES_USER: schoolnorm
      POSTGRES_PASSWORD: schoolnorm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolnorm -d schoolnorm"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: schoolnorm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: schoolnorm
      MINIO_ROOT_PASSWORD: schoolnorm_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    container_name: schoolnorm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://schoolnorm:schoolnorm_dev_password@db:5432/schoolnorm
      JWT_SECRET: change-this-secret-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:3000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: schoolnorm
      MINIO_SECRET_KEY: schoolnorm_minio_password
      MINIO_BUCKET: schoolnorm
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: schoolnorm_frontend
    restart: unless-stopped
    environment:
      # Для Windows Docker Desktop нужно использовать host.docker.internal
      NEXT_PUBLIC_API_URL: http://host.docker.internal:8000 
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data: